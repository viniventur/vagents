<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/marca.svg" />
    <title>vAgents</title>
    <script>
      // O tema antes da primeira pintura, do espelho que a tela guarda (src/lib/aparencia.ts). Sem
      // espelho, segue o Windows. No build, o Tauri põe o hash deste script na CSP.
      try {
        const t = localStorage.getItem('vagents.tema')
        const escuro = t === 'escuro' || (t !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro'
      } catch {
        // Fica o claro.
      }
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
