[package]
name = "vagents"
version = "0.1.1"
description = "vAgents: as sessões do Claude Code e os subagentes de cada uma, ao vivo"
authors = ["Vinícius Ventura"]
license = "MIT"
edition = "2021"

[lib]
name = "vagents_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A leitura das sessões do Claude Code (src-tauri/sessoes): sem Tauri, com testes próprios.
vagents-sessoes = { path = "sessoes" }

# O toque do aviso (PlaySoundW, da memória) e o "não incomodar" do Windows (SHQueryUserNotificationState).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media_Audio", "Win32_UI_Shell"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
